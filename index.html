<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>המעקב הפיננסי של בינגוס ותותי 🐱</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#0f172a; --card:#ffffff; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0;
    --brand:#6366f1; --brand2:#8b5cf6; --green:#10b981; --amber:#f59e0b; --red:#ef4444; --sky:#0ea5e9;
    --shadow:0 10px 30px -12px rgba(15,23,42,.18);
  }
  *{box-sizing:border-box}
  body{
    margin:0;font-family:'Heebo',system-ui,Arial,sans-serif;color:var(--ink);
    background:radial-gradient(1200px 600px at 100% -10%,#eef2ff 0%,transparent 55%),
               radial-gradient(1000px 600px at 0% 0%,#f5f3ff 0%,transparent 50%),#f6f7fb;
    min-height:100vh;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:22px 18px 60px}
  header.top{
    background:linear-gradient(120deg,var(--brand) 0%,var(--brand2) 100%);
    color:#fff;border-radius:22px;padding:22px 26px;box-shadow:var(--shadow);
    display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;
  }
  .top h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.3px}
  .top .right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .badge{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.16);
    border:1px solid rgba(255,255,255,.28);padding:7px 12px;border-radius:999px;font-size:12px;font-weight:500;max-width:340px}
  .badge span#statusText{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dot{width:8px;height:8px;border-radius:50%;background:#cbd5e1;flex:0 0 auto}
  .dot.live{background:#34d399;box-shadow:0 0 0 4px rgba(52,211,153,.25)}
  .dot.local{background:#fbbf24;box-shadow:0 0 0 4px rgba(251,191,36,.25)}
  .dot.err{background:#f87171;box-shadow:0 0 0 4px rgba(248,113,113,.25)}
  button.refresh{
    background:#fff;color:var(--brand);border:none;padding:9px 16px;border-radius:999px;
    font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;transition:.15s;
  }
  button.refresh:hover{transform:translateY(-1px);box-shadow:0 6px 16px -6px rgba(0,0,0,.3)}
  button.refresh:disabled{opacity:.6;cursor:default;transform:none}

  .controls{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;margin:22px 2px 6px}
  .tabs{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px;box-shadow:var(--shadow)}
  .tabs button{
    border:none;background:transparent;font-family:inherit;font-weight:600;font-size:14px;color:var(--muted);
    padding:9px 20px;border-radius:999px;cursor:pointer;transition:.18s
  }
  .tabs button.active{background:linear-gradient(120deg,var(--brand),var(--brand2));color:#fff;box-shadow:0 8px 18px -8px var(--brand)}
  .datepick{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);
    border-radius:14px;padding:8px 14px;box-shadow:var(--shadow)}
  .datepick label{font-size:13px;color:var(--muted);font-weight:500}
  .datepick select{font-family:inherit;font-size:14px;font-weight:700;color:var(--ink);border:none;background:transparent;cursor:pointer;outline:none}

  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:20px}
  @media(max-width:820px){.kpis{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:520px){.kpis{grid-template-columns:1fr}}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 18px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .kpi::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:5px;background:var(--brand)}
  .kpi.k2::before{background:var(--green)} .kpi.k3::before{background:var(--amber)}
  .kpi.k4::before{background:var(--red)} .kpi.k5::before{background:var(--brand2)} .kpi.k6::before{background:var(--sky)}
  .kpi .lbl{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:8px}
  .kpi .val{font-size:26px;font-weight:800;letter-spacing:-.5px}
  .kpi .sub{font-size:12px;color:var(--muted);margin-top:7px;line-height:1.5}
  .chip{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;margin-inline-start:6px}
  .chip.up{background:#dcfce7;color:#15803d}.chip.down{background:#fee2e2;color:#b91c1c}

  .grid2{display:grid;grid-template-columns:1.15fr .85fr;gap:16px;margin-top:20px}
  @media(max-width:900px){.grid2{grid-template-columns:1fr}}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
  .panel h3{margin:0 0 14px;font-size:15px;font-weight:700}
  .panel .chartbox{position:relative;height:280px}

  .budget-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:20px}
  @media(max-width:780px){.budget-grid{grid-template-columns:1fr}}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{text-align:right;padding:9px 8px;border-bottom:1px solid var(--line)}
  th{font-size:12px;color:var(--muted);font-weight:600}
  td.num{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
  td.pct{color:var(--muted);font-style:italic;white-space:nowrap}
  tr.total td{font-weight:800;border-top:2px solid var(--ink);border-bottom:none;padding-top:11px}
  tr.section td{background:#f8fafc;font-weight:800;color:var(--brand);font-size:12.5px}
  .foot{margin-top:26px;font-size:12px;color:var(--muted);text-align:center;line-height:1.7}
  .hidden{display:none !important}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div><h1>המעקב הפיננסי של בינגוס ותותי 🐱</h1></div>
    <div class="right">
      <span class="badge"><span class="dot" id="statusDot"></span><span id="statusText">טוען…</span></span>
      <button class="refresh" id="refreshBtn">רענן מהגיליון</button>
    </div>
  </header>

  <div class="controls">
    <div class="tabs" id="tabs">
      <button data-view="shared" class="active">משותף</button>
      <button data-view="guy">גיא</button>
      <button data-view="yael">יעל</button>
    </div>
    <div class="datepick">
      <label for="monthSel">חודש מוצג</label>
      <select id="monthSel"></select>
    </div>
  </div>

  <section class="kpis" id="kpis"></section>
  <section id="budgetSection" class="budget-grid"></section>

  <section id="chartsSection" class="hidden">
    <div class="grid2">
      <div class="panel"><h3>צמיחת הון לאורך זמן</h3><div class="chartbox"><canvas id="growthChart"></canvas></div></div>
      <div class="panel"><h3>התפלגות נכסים לפי טווח</h3><div class="chartbox"><canvas id="distChart"></canvas></div></div>
    </div>
    <div class="panel" style="margin-top:16px"><h3>פירוט חשבונות</h3><table id="accTable"></table></div>
  </section>

  <div class="foot" id="foot"></div>
</div>

<script>
/* ============================================================
   המעקב הפיננסי של בינגוס ותותי 🐱
   מקור נתונים: Google Sheets (עדכון חי, כל 60 שניות) + גיבוי מוטמע
   ============================================================ */

const SHEET_ID = "1uMRdTfbFMUR1fQoYdFOyq2Nu5WFjo_1_29weQG3c-Zc";
const TAB_GUY = "גיא", TAB_YAEL = "יעל", TAB_BUDGET = "תקציב משותף";
const POLL_MS = 60000;

/* ---------- עזרי תאריך ---------- */
const HEB_M = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
function serialToDate(s){ return new Date(Date.UTC(1899,11,30) + s*86400000); }
function serialLabel(s){ const d=serialToDate(s); return HEB_M[d.getUTCMonth()]+" "+d.getUTCFullYear(); }
function parseSerial(raw){
  const s=String(raw).trim();
  const n=Number(s.replace(/,/g,''));
  if(!isNaN(n)&&n>=30000&&n<=80000) return Math.round(n);                 // Excel serial
  let m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/);           // dd/mm/yyyy (IL)
  if(m){ let day=+m[1],mon=+m[2],yr=+m[3]; if(yr<100)yr+=2000;
    return Math.round((Date.UTC(yr,mon-1,day)-Date.UTC(1899,11,30))/86400000); }
  m=s.match(/^(\d{4})[\/.\-](\d{1,2})[\/.\-](\d{1,2})$/);                 // yyyy-mm-dd
  if(m) return Math.round((Date.UTC(+m[1],+m[2]-1,+m[3])-Date.UTC(1899,11,30))/86400000);
  return null;
}
function labelFor(raw){ const s=parseSerial(raw); return s!=null ? serialLabel(s) : String(raw).trim(); }
function num(v){ const n=Number(String(v).replace(/[₪,\s]/g,'')); return isNaN(n)?0:n; }

/* ---------- נתונים מוטמעים (גיבוי) ---------- */
const EMBEDDED_LABELS = [46022,46053,46081,46112,46142,46173,46203].map(serialLabel);
const EMBEDDED = {
  guy:{
    short:[
      {name:'מזומן',                        v:[1347,1344,1160,1160,1620,310,310]},
      {name:'תווים ושוברים',                v:[4762,3537,3606,3425,3187,2683,2371]},
      {name:'עו"ש - הבינלאומי',             v:[4347,3398,5204,7061,4985,5461,9689]},
      {name:'קרן כספית שקלית - הבינלאומי',  v:[20063,25142,25221,25299,30073,30175,30274]},
    ],
    medium:[
      {name:'קופת גמל להשקעה - אנאליסט',    v:[1221,23091,24320,24700,28143,30035,28263]},
      {name:'תיק מסחר עצמאי - IBI',          v:[276763.7,281860,286027,270699,286848,291323,289317]},
      {name:'ארנק קריפטו - MetaMask',        v:[0,0,0,0,0,358,9]},
    ],
    long:[
      {name:'קרן פנסיה - הראל',              v:[82799,84093,86220,85369,90817,94573,95452]},
      {name:'קרן השתלמות - הראל',            v:[73,74,75,72,75,77,76]},
    ],
    liab:[],
  },
  yael:{
    short:[
      {name:'מזומן',                        v:[200,200,100,150,400,200,100]},
      {name:'תווים ושוברים',                v:[300,504,388,1000,182,265,295]},
      {name:'עו"ש - הפועלים',               v:[10882,23899,7222,4932,6571,10074,7514]},
      {name:'קרן כספית שקלית - הפועלים',    v:[5029,10068,5088,5102,6220,6241,18294]},
    ],
    medium:[
      {name:'קופת גמל להשקעה - אלטשולר',    v:[46519,46851,46460,44457,47743,49912,49912]},
      {name:'קופת גמל להשקעה - אנליסט',     v:[0,0,19797,21055,25031,27657,27657]},
    ],
    long:[
      {name:'קרן פנסיה - כלל',               v:[51742,54142,56029,55320,60779,65017,65017]},
      {name:'קרנות השתלמות - כלל',           v:[18332,18911,20282,19487,22420,24438,25848]},
      {name:'קרנות גמל - כלל',               v:[893,1008,1185,1226,1502,1719,1899]},
      {name:'קרנות השתלמות - אלטשולר',       v:[21999,22144,21951,20996,22542,23563,23563]},
      {name:'קרנות גמל - אלטשולר',           v:[43119,43421,43050,41176,44216,46228,46228]},
    ],
    liab:[],
  },
};
const EMBEDDED_BUDGET = [
  {title:'הכנסות', rows:[
    ['משכורת EY - גיא',9200],['משכורת עיריית תל אביב - יעל',9600],['משכורת בית אבי-חי - יעל',1300],
    ['קצבת נכות - גיא',1200],['משכורת מרכז טאוב - יעל',600],['תווי קניה EY - גיא',400]]},
  {title:'הוצאות - קבועות', rows:[
    ['שכר דירה',6500],['אימונים',300],['תחבורה ציבורית',300],['חשמל',200],['טיפוח',250],
    ['ועד בית',195],['מים',110],['אינטרנט',105],['גז',65],['ארנונה',60]]},
  {title:'הוצאות - משתנות', rows:[['יציאות',2500],['סופר',1500],['בלת"מ',1500],['קניות',2000]]},
  {title:'חיסכון/השקעה', rows:[
    ['חיסכון כללי - יעל',1200],['חיסכון כללי - גיא',2000],['קופת גמל להשקעה - יעל',2000],
    ['קופת גמל להשקעה - גיא',1200],['יתרה',315]]},
];

/* ---------- מצב עבודה ---------- */
let DATA = JSON.parse(JSON.stringify(EMBEDDED));
let BUDGET = JSON.parse(JSON.stringify(EMBEDDED_BUDGET));
let LABELS = EMBEDDED_LABELS.slice();
let currentView = 'shared';
let selIdx = LABELS.length - 1;

/* ---------- חישוב ---------- */
const nis = n => '₪' + Math.round(n).toLocaleString('he-IL');
const pct = n => (n*100).toFixed(1) + '%';
function householdExpense(){
  const t = name => (BUDGET.find(b=>b.title===name)||{rows:[]}).rows.reduce((a,r)=>a+r[1],0);
  return (t('הוצאות - קבועות') + t('הוצאות - משתנות')) || 15585;
}
function rangeTotals(person, idx){
  const sum = arr => (arr||[]).reduce((a,r)=>a+(r.v[idx]||0),0);
  const s=sum(DATA[person].short), m=sum(DATA[person].medium), l=sum(DATA[person].long), liab=sum(DATA[person].liab);
  const assets=s+m+l;
  return {short:s,medium:m,long:l,liab,liquid:s+m,nonLiquid:l,assets,total:assets-liab};
}
function combinedTotals(idx){
  const g=rangeTotals('guy',idx), y=rangeTotals('yael',idx);
  const k=['short','medium','long','liab','liquid','nonLiquid','assets','total'];
  const o={}; k.forEach(x=>o[x]=g[x]+y[x]); return o;
}
const totalsFor = (view,idx)=> view==='shared'?combinedTotals(idx):rangeTotals(view,idx);
const seriesFor = view => LABELS.map((_,i)=> view==='shared'?combinedTotals(i).total:rangeTotals(view,i).total);

/* ---------- KPIs ---------- */
function renderKPIs(){
  const t=totalsFor(currentView,selIdx), series=seriesFor(currentView), base=series[0];
  const changeAbs=t.total-base, growthPct=base?changeAbs/base:0, avgMonthly=selIdx>0?changeAbs/selIdx:0;
  const liq=t.total?t.liquid/t.total:0;
  const expense=currentView==='shared'?householdExpense():householdExpense()/2;
  const emergency=expense?t.short/expense:0, up=changeAbs>=0;
  const cards=[
    {c:'k1',lbl:'הון כולל',val:nis(t.total),
     sub:`שינוי מ‑31/12/2025: ${nis(changeAbs)} <span class="chip ${up?'up':'down'}">${up?'▲':'▼'} ${pct(growthPct)}</span><br>בסיס: ${nis(base)}`},
    {c:'k2',lbl:'הון נזיל',val:nis(t.liquid),sub:`שיעור נזילות: ${pct(liq)}`},
    {c:'k3',lbl:'הון לא נזיל',val:nis(t.nonLiquid),sub:'פנסיה, גמל והשתלמות'},
    {c:'k4',lbl:'התחייבויות',val:nis(t.liab),sub:'הלוואות והתחייבויות אחרות'},
    {c:'k5',lbl:'שינוי חודשי ממוצע',val:nis(avgMonthly),sub:`על פני ${selIdx} חודשים`},
    {c:'k6',lbl:'חודשי כיסוי חירום',val:emergency.toFixed(1)+' חודשים',
     sub:`טווח קצר: ${nis(t.short)} · הוצאה: ${nis(expense)}`},
  ];
  document.getElementById('kpis').innerHTML=cards.map(k=>`
    <div class="kpi ${k.c}"><div class="lbl">${k.lbl}</div><div class="val">${k.val}</div><div class="sub">${k.sub}</div></div>`).join('');
}

/* ---------- טבלאות תקציב (משותף) — ממוין יורד לפי גודל ---------- */
function renderBudget(){
  document.getElementById('budgetSection').innerHTML = BUDGET.slice(0,4).map(tbl=>{
    const total=tbl.rows.reduce((a,r)=>a+r[1],0);
    const sorted=tbl.rows.slice().sort((a,b)=>b[1]-a[1]);
    const body=sorted.map(r=>`<tr><td>${r[0]}</td><td class="num">${nis(r[1])}</td><td class="pct">${pct(total?r[1]/total:0)}</td></tr>`).join('');
    return `<div class="panel"><h3>${tbl.title}</h3>
      <table><thead><tr><th>שם החשבון</th><th>סכום</th><th>אחוז</th></tr></thead>
      <tbody>${body}<tr class="total"><td>סה"כ ${tbl.title}</td><td class="num">${nis(total)}</td><td class="pct">100.0%</td></tr></tbody></table></div>`;
  }).join('');
}

/* ---------- גרפים ---------- */
let growthChart=null, distChart=null;
function renderCharts(){
  const person=currentView, series=LABELS.map((_,i)=>rangeTotals(person,i).total), t=rangeTotals(person,selIdx);
  const gctx=document.getElementById('growthChart');
  if(growthChart) growthChart.destroy();
  growthChart=new Chart(gctx,{type:'line',
    data:{labels:LABELS,datasets:[{label:'הון כולל',data:series,tension:.35,fill:true,
      borderColor:'#6366f1',backgroundColor:'rgba(99,102,241,.12)',pointBackgroundColor:'#6366f1',
      pointRadius:series.map((_,i)=>i===selIdx?6:3),borderWidth:3}]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>nis(c.parsed.y)}}},
      scales:{y:{ticks:{callback:v=>'₪'+(v/1000).toFixed(0)+'K'},grid:{color:'#eef2f7'}},x:{grid:{display:false}}}}});
  const dctx=document.getElementById('distChart');
  if(distChart) distChart.destroy();
  distChart=new Chart(dctx,{type:'doughnut',
    data:{labels:['טווח קצר','טווח בינוני','טווח ארוך'],datasets:[{data:[t.short,t.medium,t.long],
      backgroundColor:['#0ea5e9','#8b5cf6','#f59e0b'],borderWidth:2,borderColor:'#fff'}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:'62%',
      plugins:{legend:{position:'bottom',labels:{font:{family:'Heebo',size:13}}},
        tooltip:{callbacks:{label:c=>c.label+': '+nis(c.parsed)+' ('+pct(c.parsed/((t.short+t.medium+t.long)||1))+')'}}}}});
}

/* ---------- פירוט חשבונות (אישי) — ללא שורת סה"כ הון ---------- */
function renderAccounts(){
  const person=currentView, t=rangeTotals(person,selIdx), grand=t.assets||1;
  const sec=(title,arr,subtotal)=>{
    const rows=(arr||[]).map(r=>`<tr><td>${r.name}</td><td class="num">${nis(r.v[selIdx]||0)}</td><td class="pct">${pct((r.v[selIdx]||0)/grand)}</td></tr>`).join('');
    return `<tr class="section"><td colspan="3">${title}</td></tr>${rows}
      <tr class="total"><td>סה"כ ${title}</td><td class="num">${nis(subtotal)}</td><td class="pct">${pct(subtotal/grand)}</td></tr>`;
  };
  document.getElementById('accTable').innerHTML=`
    <thead><tr><th>שם החשבון</th><th>יתרה</th><th>% מסך הנכסים</th></tr></thead>
    <tbody>
      ${sec('נכסים - טווח קצר',DATA[person].short,t.short)}
      ${sec('נכסים - טווח בינוני',DATA[person].medium,t.medium)}
      ${sec('נכסים - טווח ארוך',DATA[person].long,t.long)}
    </tbody>`;
}

/* ---------- רינדור ראשי ---------- */
function render(){
  if(selIdx>LABELS.length-1) selIdx=LABELS.length-1;
  renderKPIs();
  const isShared=currentView==='shared';
  document.getElementById('budgetSection').classList.toggle('hidden',!isShared);
  document.getElementById('chartsSection').classList.toggle('hidden',isShared);
  if(isShared) renderBudget(); else { renderCharts(); renderAccounts(); }
  document.getElementById('foot').innerHTML=
    `נכון ל‑${LABELS[selIdx]} · הדשבורד המשותף מחושב כסכום גיא + יעל · מקור: Google Sheets`;
}
function buildMonthSelect(){
  document.getElementById('monthSel').innerHTML=
    LABELS.map((lbl,i)=>`<option value="${i}" ${i===selIdx?'selected':''}>${lbl}</option>`).join('');
}

/* ---------- אירועים ---------- */
document.getElementById('tabs').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  document.querySelectorAll('#tabs button').forEach(x=>x.classList.remove('active'));
  b.classList.add('active'); currentView=b.dataset.view; render();
});
document.getElementById('monthSel').addEventListener('change',e=>{selIdx=+e.target.value; render();});
document.getElementById('refreshBtn').addEventListener('click',()=>loadLive(true));

/* ============================================================
   סנכרון חי מ‑Google Sheets דרך gviz CSV
   ============================================================ */
function setStatus(state,msg){
  const dot=document.getElementById('statusDot'), txt=document.getElementById('statusText');
  dot.className='dot '+(state||''); txt.textContent=msg; txt.title=msg;
}
function gvizURL(sheetName){
  return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}&headers=0&t=${Date.now()}`;
}
function parseCSV(text){
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){ if(c=='"'){ if(text[i+1]=='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else{ if(c=='"')q=true; else if(c==','){row.push(cur);cur='';}
      else if(c=='\n'){row.push(cur);rows.push(row);row=[];cur='';}
      else if(c=='\r'){} else cur+=c; }
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row);}
  return rows;
}

/* פרסור טאב אישי — זיהוי עמודות לפי כל תא לא-ריק בשורת "שם החשבון" */
function parsePerson(rows){
  let hr=-1,nameCol=-1;
  for(let r=0;r<rows.length;r++){
    const c=rows[r].findIndex(x=>String(x).includes('שם החשבון'));
    if(c>=0){hr=r;nameCol=c;break;}
  }
  if(hr<0) throw new Error('לא נמצאה שורת כותרת "שם החשבון"');
  const header=rows[hr], monthCols=[];
  for(let c=nameCol+1;c<header.length;c++){
    const cell=String(header[c]).trim();
    if(cell!=='') monthCols.push({idx:c,label:labelFor(cell)});
  }
  if(!monthCols.length) throw new Error('לא נמצאו עמודות חודשים בכותרת');
  const labels=monthCols.map(m=>m.label);
  const sections={short:[],medium:[],long:[],liab:[]};
  let cur=null;
  for(let r=hr+1;r<rows.length;r++){
    const name=String(rows[r][nameCol]||'').trim(); if(!name) continue;
    if(name.includes('טווח קצר')&&!name.includes('סה')){cur='short';continue;}
    if(name.includes('טווח בינוני')&&!name.includes('סה')){cur='medium';continue;}
    if(name.includes('טווח ארוך')&&!name.includes('סה')){cur='long';continue;}
    if(name.includes('התחייבויות')&&!name.includes('סה')){cur='liab';continue;}
    if(name.includes('סה"כ')||name.includes('שינוי')||name.includes('שיעור')||name.includes('חודש')||name.includes('סך ')) continue;
    if(!cur) continue;
    sections[cur].push({name, v:monthCols.map(m=>num(rows[r][m.idx]))});
  }
  if(!sections.short.length && !sections.long.length && !sections.medium.length) throw new Error('לא זוהו חשבונות');
  return {labels,sections};
}

/* פרסור טאב תקציב — ארבעה בלוקים דינמיים */
function parseBudget(rows){
  const titles=['הכנסות','הוצאות - קבועות','הוצאות - משתנות','חיסכון/השקעה'];
  const flat=rows.map(r=>r.map(c=>String(c).trim())), out=[];
  for(const title of titles){
    let start=-1;
    for(let r=0;r<flat.length;r++){ if(flat[r].some(c=>c===title)){start=r;break;} }
    if(start<0){out.push(null);continue;}
    const block={title,rows:[]};
    for(let r=start+1;r<flat.length;r++){
      const cells=flat[r]; if(cells.join('').includes('סה"כ')) break;
      const nameIdx=cells.findIndex(c=>/[א-ת]/.test(c)&&!/^\d/.test(c)&&c.length>1);
      if(nameIdx<0) continue;
      const nm=cells[nameIdx]; if(titles.includes(nm)) continue;
      let amt=0; for(let k=0;k<cells.length;k++){ if(k===nameIdx) continue; const n=num(cells[k]); if(n>amt) amt=n; } // הסכום = המספר הגדול ביותר בשורה (מדלג על מס' שורה ועל אחוז)
      if(nm&&amt>0) block.rows.push([nm,amt]);
    }
    out.push(block.rows.length?block:null);
  }
  return out.every(b=>b)?out:null;
}

async function fetchSheet(name){
  let res;
  try{ res=await fetch(gvizURL(name),{cache:'no-store'}); }
  catch(e){ throw new Error('החיבור נחסם (CORS) — ודא שהגיליון משותף כ"כל מי שיש לו קישור → צופה"'); }
  if(!res.ok) throw new Error('שגיאת HTTP '+res.status+' בעת קריאת הטאב "'+name+'"');
  const txt=await res.text();
  if(/^\s*</.test(txt)) throw new Error('גוגל החזיר דף התחברות — הגיליון כנראה אינו משותף לצפייה ציבורית');
  return parseCSV(txt);
}

async function loadLive(userTriggered){
  const btn=document.getElementById('refreshBtn');
  btn.disabled=true; setStatus('','מסנכרן…');
  try{
    const [guyRows,yaelRows]=await Promise.all([fetchSheet(TAB_GUY),fetchSheet(TAB_YAEL)]);
    const guy=parsePerson(guyRows), yael=parsePerson(yaelRows);
    // מס' העמודות המקסימלי המשותף (הכותרת מכילה חודשים עתידיים ריקים עד ~2030)
    const maxCols=Math.min(guy.labels.length,yael.labels.length);
    // אינדקס העמודה האחרונה שבה קיימים נתונים בפועל (מדלג על חודשים עתידיים ריקים)
    const lastDataIndex=(sec)=>{let last=-1;
      for(let i=0;i<maxCols;i++){let tot=0;
        for(const k in sec) sec[k].forEach(a=>tot+=Math.abs(a.v[i]||0));
        if(tot>0) last=i;}
      return last;};
    const last=Math.max(lastDataIndex(guy.sections),lastDataIndex(yael.sections));
    const n=(last>=0?last:maxCols-1)+1; // מספר החודשים לשמירה — עד החודש האחרון עם נתונים
    const clamp=sec=>{const o={};for(const k in sec)o[k]=sec[k].map(a=>({name:a.name,v:a.v.slice(0,n)}));return o;};
    DATA={guy:clamp(guy.sections),yael:clamp(yael.sections)};
    LABELS=guy.labels.slice(0,n);
    selIdx=LABELS.length-1;
    try{ const b=parseBudget(await fetchSheet(TAB_BUDGET)); if(b) BUDGET=b; }catch(_){}
    buildMonthSelect(); render();
    setStatus('live','מסונכרן מהגיליון · '+new Date().toLocaleTimeString('he-IL'));
  }catch(err){
    DATA=JSON.parse(JSON.stringify(EMBEDDED));
    BUDGET=JSON.parse(JSON.stringify(EMBEDDED_BUDGET));
    LABELS=EMBEDDED_LABELS.slice(); selIdx=LABELS.length-1;
    buildMonthSelect(); render();
    setStatus(userTriggered?'err':'local',(userTriggered?'הסנכרון נכשל: ':'נתונים מוטמעים · ')+(err.message||err));
  }finally{ btn.disabled=false; }
}

/* ---------- אתחול + סנכרון אוטומטי ---------- */
buildMonthSelect(); render(); loadLive(false);
setInterval(()=>loadLive(false), POLL_MS);
